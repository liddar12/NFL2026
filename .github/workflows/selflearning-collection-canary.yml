# Test-only durable collection acceptance. No production tokens or hosted writes.
name: selflearning-collection-canary

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: selflearning-collection-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-boundaries:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_ENGINE_COMMIT: 5fd6475cc1895f0a7f63132dfae58c7e0729f458
    steps:
      - name: Checkout exact NFL test tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: nfl
          persist-credentials: false
      - name: Checkout exact engine test tree
        uses: actions/checkout@v4
        with:
          repository: liddar12/SelfLearning
          ref: 5fd6475cc1895f0a7f63132dfae58c7e0729f458
          path: selflearning
          persist-credentials: false
      - name: Setup hosted test Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node for PostgreSQL-WASM
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable source inputs
        shell: bash
        run: |
          test "$(git -C nfl rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C selflearning rev-parse HEAD)" = "$EXPECTED_ENGINE_COMMIT"
      - name: Install pinned engine test dependencies
        working-directory: selflearning
        run: python -m pip install -r requirements.txt 'pytest>=8.0'
      - name: Install the same pinned local SQL test dependency as engine CI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/selflearn-pglite" --no-save --package-lock=false @electric-sql/pglite@0.3.16
          printf 'SELFLEARN_PGLITE_MODULE=%s\n' "$RUNNER_TEMP/selflearn-pglite/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
      - name: Exercise original-run recovery through local ASGI and SQLite
        working-directory: nfl
        shell: bash
        run: |
          set -o pipefail
          python -B tests/pilot_collection_handoff.py \
            --engine-checkout ../selflearning \
            --expected-engine-sha "$EXPECTED_ENGINE_COMMIT" \
            2>&1 | tee "$RUNNER_TEMP/collection-handoff.log"
      - name: Verify roster-bound outcome replay and lost replies
        working-directory: selflearning
        shell: bash
        env:
          NFL2026_CHECKOUT: ${{ github.workspace }}/nfl
          PYTHONPATH: packages/selflearn-core:tests
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            tests/postgres/test_capture_outcomes_atomic.py \
            tests/postgres/test_capture_application_sender_failures.py \
            tests/postgres/test_capture_application_adapter.py \
            tests/postgres/test_capture_application_api.py \
            tests/postgres/test_capture_delivery_adapter.py \
            tests/postgres/test_capture_delivery_job.py \
            tests/postgres/test_capture_intake_api.py \
            tests/postgres/test_nfl_outcome_export_api.py \
            tests/postgres/test_nfl_trace_api.py \
            tests/postgres/test_capture_application_large.py \
            2>&1 | tee "$RUNNER_TEMP/outcome-replay.log"
      - name: Retain test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selflearning-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/collection-handoff.log
            ${{ runner.temp }}/outcome-replay.log
          if-no-files-found: error
          retention-days: 7
