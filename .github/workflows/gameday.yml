# Gameday windows: probability locks + result grading on Thu / Sun / Mon.
#
# ONE workflow, TWO modes, selected by the workflow_dispatch input `mode`
# (lock | scores | both). A `schedule:` run leaves that input EMPTY, which matches
# neither guard below, so a cron always fires the full graph. CRON THROTTLING still
# applies (see daily.yml) — these windows are deliberately WIDE and frequent so that
# even a throttled runner catches the events it needs; true second-by-second scores are
# an edge-function concern, not this cron's.
#
# R87 (F17) — gameday used to publish a DIFFERENT dependency graph from daily.yml: it
# rebuilt game_predictions.json but never rebuilt the MY PARLAYS leg pool and never
# appended or resolved a single leg. So a Sunday window shipped GAME cards priced off
# fresh inactives next to MY cards still priced off Saturday's pool, and a leg first
# offered inside a gameday window could reach kickoff with no receipt at all. The two
# graphs below are now the real ones, in real dependency order.
#
# LOCK MODE (steps guarded `mode != 'scores'`, plus every unguarded step):
#   resolve_locks -> refit -> build_predictions (+ snapshot copy) -> build_parlay_archive
#   -> build_leg_pool -> build_my_cards -> build_parlay_ledger -> resolve_parlay_legs
#   -> resolve_my_cards -> build_review -> validate_data -> commit
#   Every arrow is a genuine dependency: refit grades before it fits, the pool copies the
#   slate build_predictions just wrote and prices props from the same weekly projections,
#   the ledger records what the pool and cards just offered, and build_review consumes
#   the resolved rows. A locked snapshot is the leak-safe, point-in-time prediction the
#   backtest later grades against — once a game kicks off its prediction is never edited.
#
# SCORES MODE (unguarded steps only — nothing is re-priced, nothing new is offered):
#   resolve_locks -> refit -> build_parlay_archive -> resolve_parlay_legs
#   -> resolve_my_cards -> build_review -> validate_data -> commit
#   STATUS-GATING is enforced in scripts/scrape/espn.py, not here: only FINAL games
#   become actuals; live / halftime / 0-0 scheduled stubs are display-only and never
#   scored. refit is a clean no-op unless this run resolved a new lock.
#
# The two resolvers carry NO mode guard on purpose — grading is mode-independent (see
# their step comment). Full step table: docs/PIPELINE_GRAPH.md.
name: gameday

on:
  schedule:
    # Times are UTC. NFL game days (US): Thu night, Sun all day, Mon night. We fire on a
    # coarse grid across those windows; throttling means treat each as "around then".
    - cron: "0 */2 * * 0"   # Sunday, every 2h  (main slate)
    - cron: "0 0,2 * * 1"   # Mon 00:00 & 02:00 UTC (Sun night / early Mon)
    - cron: "0 0,2 * * 2"   # Tue 00:00 & 02:00 UTC (Mon Night Football tail)
    - cron: "0 0,2 * * 5"   # Fri 00:00 & 02:00 UTC (Thu Night Football tail)
  workflow_dispatch:
    inputs:
      mode:
        description: "lock | scores | both"
        default: "both"

concurrency:
  group: gameday
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gameday:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install --upgrade requests   # scores/odds only; nflverse not needed here

      # R88 (F17) — OPEN THE PER-STAGE RECORD. Every pipeline step below runs
      # under scripts/stage.sh, which appends that step's outcome (status, exit
      # code, duration) to data/pipeline_stages.json. `begin` opens a new run for
      # this workflow: it clears the previous run's rows and CARRIES each stage's
      # last success forward, so a stage that has not succeeded in days says the
      # day it last did. Several steps below are continue-on-error, so before
      # this a failed resolver left the run green with the only evidence in the
      # Actions log; the MODEL tab's PIPELINE STAGES card reads this document.
      - name: Begin per-stage record (R88)
        run: python3 scripts/stage_status.py begin --workflow gameday --run-id "${{ github.run_id }}"

      # LEARNING LOOP step 1 — RESOLVE. Grade the point-in-time record first: any
      # locked row whose game is now FINAL gets actual/brier/log_loss filled in
      # place (STATUS-gated; idempotent; clean no-op when nothing is FINAL yet).
      - name: Resolve locks against FINAL scores
        run: bash scripts/stage.sh gameday "Resolve locks against FINAL scores" -- python -m scripts.resolve_locks

      # LEARNING LOOP step 2 — REFIT. Grid-search game params on the resolved
      # locks; adoption is NEVER-REGRESS gated, every outcome (adopted or not) is
      # archived in data/model_tuning.json history. Clean no-op with zero resolved
      # rows, so most runs change nothing.
      - name: Refit game params from resolved locks (NEVER REGRESS)
        run: bash scripts/stage.sh gameday "Refit game params from resolved locks (NEVER REGRESS)" -- python -m scripts.refit

      # PRE-KICKOFF PROBABILITY LOCK. Regenerate predictions from current inputs and
      # write an immutable point-in-time snapshot under data/snapshots/. The harness
      # (scripts/harness/snapshot.py, another agent) owns the snapshot format; here we
      # just invoke the offline build then archive its output. Leak-safe by construction:
      # we lock BEFORE kickoff, never after.
      - name: Lock pre-kickoff probabilities
        if: ${{ github.event.inputs.mode != 'scores' }}
        # ODDS_API_KEY was passed by daily.yml but NOT here, so every gameday
        # window rebuilt the market feeds keyless: pipeline_status flipped
        # odds_api to "unconfigured" and parlays.json shipped without spread
        # legs — the 06:00 daily run would fix it and the next gameday window
        # would break it again, a flap that read as "the odds feed is flaky"
        # when it was one missing env line. Same optionality as daily.yml:
        # an absent secret degrades honestly, never fails the run.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # R88 — ONE stage. The build and the snapshot copy are a single logical
        # step (a snapshot with no build behind it records nothing), so the whole
        # block runs under one scripts/stage.sh record via `bash -c` and the
        # record shows one LOCK stage rather than five shell lines. The copy
        # archives a timestamped snapshot of the REAL game predictions as the
        # locked, point-in-time record (leak-safe: locked before kickoff, never
        # edited after).
        run: bash scripts/stage.sh gameday "Lock pre-kickoff probabilities" -- bash -c 'python -m scripts.build_predictions && ts="$(date -u +%Y%m%dT%H%M%SZ)" && mkdir -p data/snapshots && cp data/game_predictions.json "data/snapshots/game_predictions.${ts}.json" && echo "locked snapshot data/snapshots/game_predictions.${ts}.json"'

      # R73 — WEEK-TO-WEEK PARLAY HISTORY. Archive the week parlays.json holds
      # (created on first sight, refreshed while open, frozen once every game is
      # FINAL) and rebuild data/parlays/index.json. Idempotent per updated_utc.
      # DELIBERATELY ONE STEP, UNGUARDED: it is the one thing both modes need — in
      # lock mode it archives the parlays build_predictions just rewrote, in scores
      # mode it freezes the week whose games have now gone FINAL. It already sits
      # after the lock step, so keeping it here satisfies both orderings and every
      # R87 step below follows it.
      - name: Parlay archive (per-week history + index)
        run: bash scripts/stage.sh gameday "Parlay archive (per-week history + index)" -- python3 scripts/build_parlay_archive.py

      # R87 (F17) — MY PARLAYS REBUILT UNDER THIS GENERATION. Without this step the
      # window refreshed game_predictions.json and left data/leg_pool.json at whatever
      # the last daily run wrote, which is exactly the GAME-moves-while-MY-does-not
      # split F17 names. It runs immediately after build_predictions because it copies
      # the slate's game legs verbatim and prices its props from the weekly projections
      # that build just refreshed. Stdlib, offline, reads only committed data/. It
      # REFUSES to write while its calibration gate is red, so a red gate leaves the
      # previous pool standing rather than shipping legs priced by coefficients that
      # did not pass — that refusal is a healthy outcome, not a failure to retry.
      - name: MY PARLAYS leg pool (rebuild under this generation)
        if: ${{ github.event.inputs.mode != 'scores' }}
        run: bash scripts/stage.sh gameday "MY PARLAYS leg pool (rebuild under this generation)" -- python3 scripts/build_leg_pool.py

      # R87 (F17) — the cards actually OFFERED, recorded on first sight. A card that
      # only ever appeared inside a gameday window previously had no pre-kickoff
      # receipt; now the window that offers it is the window that locks it. Stdlib and
      # offline; an absent data/leg_pool.json (the refusal above) is a one-line skip
      # with exit 0, never a failed run.
      - name: MY PARLAYS offered cards (first-sight lock)
        if: ${{ github.event.inputs.mode != 'scores' }}
        run: bash scripts/stage.sh gameday "MY PARLAYS offered cards (first-sight lock)" -- python3 scripts/build_my_cards.py

      # R87 (F17) — as-made pricing for every shipped leg, locked pre-kickoff.
      # Idempotent per parlays.json updated_utc, so the two-hourly Sunday grid appends
      # once per generation and a post-kickoff leg is recorded unlocked rather than
      # back-dated. Must follow the pool and the cards: it records what they offered.
      - name: Parlay-leg ledger append (as-made pricing, locked pre-kickoff)
        if: ${{ github.event.inputs.mode != 'scores' }}
        run: bash scripts/stage.sh gameday "Parlay-leg ledger append (as-made pricing, locked pre-kickoff)" -- python scripts/build_parlay_ledger.py

      # R88 (F17) — SCORES MODE, WRITTEN DOWN. The four steps above carry a mode
      # guard, so in scores mode GitHub simply does not run them and the stage
      # record would say nothing at all about four steps a reader can see in the
      # graph. Silence is the defect F17 names, so scores mode records them as
      # `skipped` WITH A REASON: "did not run" and "ran and failed" are different
      # facts, and the MODEL tab must be able to tell them apart. One step rather
      # than four inverse guards, because there is one reason to state.
      - name: Record scores-mode skips (R88)
        if: ${{ github.event.inputs.mode == 'scores' }}
        run: |
          python3 scripts/stage_status.py skip --workflow gameday --stage "Lock pre-kickoff probabilities" --reason "scores mode: nothing is re-priced"
          python3 scripts/stage_status.py skip --workflow gameday --stage "MY PARLAYS leg pool (rebuild under this generation)" --reason "scores mode: nothing is re-priced"
          python3 scripts/stage_status.py skip --workflow gameday --stage "MY PARLAYS offered cards (first-sight lock)" --reason "scores mode: no new card is offered"
          python3 scripts/stage_status.py skip --workflow gameday --stage "Parlay-leg ledger append (as-made pricing, locked pre-kickoff)" --reason "scores mode: no new leg is offered"

      # R87 (F17) — GRADING IS MODE-INDEPENDENT, so these two carry NO mode guard.
      # Thursday's legs go FINAL inside Sunday's lock window and Sunday's inside
      # Monday's; a `mode != 'lock'` guard would strand precisely those. Both are
      # idempotent and, while no week has resolved, skip loudly with an honest
      # 0-resolved record — they never invent a log-loss — so running them in every
      # mode costs a no-op. Both need the network (nflverse weekly yards), hence
      # continue-on-error: a stats outage degrades the record, never the run, and
      # build_review below still reports on whatever did resolve.
      - name: Resolve parlay legs against nflverse weekly yards
        run: bash scripts/stage.sh --continue-on-error gameday "Resolve parlay legs against nflverse weekly yards" -- python scripts/resolve_parlay_legs.py
        continue-on-error: true

      - name: Resolve MY cards against nflverse weekly yards
        run: bash scripts/stage.sh --continue-on-error gameday "Resolve MY cards against nflverse weekly yards" -- python scripts/resolve_my_cards.py
        continue-on-error: true

      # SCORES MODE, STATED HONESTLY. There is no longer a "Refresh scores" step,
      # because there was never anything behind it: the removed line ran a scores
      # CLI module under scripts/scrape/ that has never existed in this repo, and
      # ran it under `|| true`, so the step reported success for work it never did.
      # Scores mode is, in full: resolve_locks (the first step above; it is the real
      # ESPN FINAL reader and it status-gates), refit, the parlay archive, the two
      # resolvers, build_review, validate_data, commit. Every one of those is
      # unguarded above, so scores mode needs no step of its own.

      # (build_predictions writes data/pipeline_status.json with honest feed health, so
      # that document describes the LOCK half of this graph only — the ledger, resolver
      # and review steps that follow it are NOT covered by it. F17's per-stage
      # last-success / skipped-reason watermarks remain out of scope; see
      # docs/PIPELINE_GRAPH.md.)

      # R71 — post-game review: STATUS-gated results from the lock receipts /
      # ESPN finals so the slate circles land inside the gameday window.
      - name: Build post-game review (data/review.json)
        run: bash scripts/stage.sh gameday "Build post-game review (data/review.json)" -- python3 scripts/build_review.py

      - name: Validate data contracts
        run: python scripts/validate_data.py

      # RACE-SAFE PUBLISH (F16). daily.yml may push while this window commits, and
      # the two are on DIFFERENT concurrency groups so nothing serialises them.
      # The old fast-forward-only pull-and-push retry loop could not merge two
      # commits from a common base; scripts/publish_data.sh now owns the publish
      # and is race-safe by construction — see docs/PUBLISH.md. data/ includes
      # the snapshots and data/pipeline_stages.json.
      - name: Commit snapshots + data
        run: 'bash scripts/publish_data.sh "data: gameday refresh [skip actions]"'
