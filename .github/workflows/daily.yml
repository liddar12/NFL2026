# Daily data pipeline: scrape -> build models -> feed-health -> commit data/.
#
# CRON THROTTLING WARNING (inherited from wc2026, do not forget):
# GitHub Actions `schedule:` triggers are best-effort and HEAVILY throttled on busy
# runners — a job nominally at 06:00 UTC can fire hours late or occasionally be skipped.
# So NOTHING real-time may depend on this cadence. This daily job is for the durable,
# slow-moving record (rosters, weekly stats, season projections). Live in-game scores
# come from the gameday windows (gameday.yml) and, ultimately, an edge endpoint — never
# from this cron's timing.
name: daily-pipeline

on:
  # R78 (owner's standing order, 2026-09-17): a morning and an evening refresh
  # every day, plus one hour before each kickoff window (Mon/Thu night, the
  # three Sunday windows). Times are America/New_York expressed in UTC while
  # EDT (UTC-4) is in effect; after 2026-11-01 (EST) each fires an hour EARLIER
  # on the clock unless re-set — an hour early is harmless, a silent gap is
  # not. Minutes are deliberately OFF the hour: GitHub queues :00 schedules
  # behind everyone else's and those are the ones that fire hours late. The
  # pipeline is idempotent, so an extra run with unchanged sources commits
  # nothing. The same cadence is also driven by workflow_dispatch from the
  # owner's Claude Routines; whichever fires first does the work.
  schedule:
    - cron: "7 10 * * *"     # 06:07 ET daily — morning
    - cron: "7 22 * * *"     # 18:07 ET daily — evening
    - cron: "15 23 * * 1,4"  # 19:15 ET Mon/Thu — 1h before the 8:15pm kickoff
    - cron: "3 16 * * 0"     # 12:03 ET Sun — 1h before the 1pm window
    - cron: "15 19 * * 0"    # 15:15 ET Sun — 1h before the 4pm window
    - cron: "20 23 * * 0"    # 19:20 ET Sun — 1h before Sunday Night Football
  workflow_dispatch: {}    # allow manual runs from the Actions tab

# Only one pipeline commit in flight at a time; cancel a stale run if a new one starts.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write          # needed to commit regenerated data/ back to main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the race-safe publish can reconcile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Heavy data libs live ONLY on the pipeline runner, never in the gate. The gate
      # (ci.yml) installs nothing.
      - name: Install pipeline dependencies
        run: pip install --upgrade requests

      # R88 (F17) — OPEN THE PER-STAGE RECORD. Every pipeline step below runs
      # under scripts/stage.sh, which appends that step's outcome (status, exit
      # code, duration) to data/pipeline_stages.json. `begin` opens a new run for
      # this workflow: it clears the previous run's rows and CARRIES each stage's
      # last success forward, so a stage that has not succeeded in days says the
      # day it last did. Several steps below are continue-on-error, so before
      # this a failed resolver left the run green with the only evidence in the
      # Actions log; the MODEL tab's PIPELINE STAGES card reads this document.
      - name: Begin per-stage record (R88)
        run: python3 scripts/stage_status.py begin --workflow daily --run-id "${{ github.run_id }}"

      # Step 0 — LEARNING LOOP resolve. Grade yesterday's locks BEFORE rebuilding,
      # so the day's build sees a fully resolved record (and any adopted params).
      # STATUS-gated + idempotent; clean no-op when no locked game has gone FINAL.
      - name: Resolve locks against FINAL scores
        run: bash scripts/stage.sh daily "Resolve locks against FINAL scores" -- python -m scripts.resolve_locks

      # Step 1 — deterministic offline outputs from committed fixtures: player
      # projections + parlays. Stdlib only, no network; safe on any runner.
      - name: Build fixture-based players + parlays
        run: bash scripts/stage.sh daily "Build fixture-based players + parlays" -- python -m scripts.build_all

      # Step 2 — the REAL feed. ESPN 2026 schedule + 2025 FINAL results -> Elo priors
      # -> game predictions, plus schedule_full, real team identity, injuries, and the
      # honest feed-health status. Runs AFTER build_all so real game data overwrites the
      # fixture placeholder. Fails LOUDLY on a broken feed (no continue-on-error). Market
      # feeds (odds/kalshi) stay "degraded" until ODDS_API_KEY is set; nflverse joins
      # when its scraper is wired (proxy-blocked in some sandboxes, fine on GH runners).
      - name: Refresh injury history (qb_out + skill_out application freshness)
        run: bash scripts/stage.sh daily "Refresh injury history (qb_out + skill_out application freshness)" -- python scripts/build_injury_history.py

      - name: Refresh weather forecast (weather_wind application freshness)
        run: bash scripts/stage.sh --continue-on-error daily "Refresh weather forecast (weather_wind application freshness)" -- python scripts/build_weather_forecast.py
        continue-on-error: true   # forecast is best-effort; absence is dormant, not fatal

      # R94 — keep the PRE-KICKOFF forecast we actually saw. The step above
      # overwrites data/weather_forecast.json in place, so today's view of
      # Sunday's weather is gone by tomorrow; the reanalysis corpus we measure on
      # is what the weather TURNED OUT to be, which no one knows before kickoff.
      # This appends (game, fetched_utc, precip, temp, wind) and never rewrites a
      # row it already holds, so a later phase can fit on what was knowable at
      # lock time instead of on hindsight. Climatology rows are refused at the
      # door — they are a long-run average, not an observation. It reads nothing
      # but the file above, is read by nothing, and changes no shipped number.
      # Directly after its source step and continue-on-error like it: when the
      # forecast refresh degrades there is simply nothing new to append, and a
      # run that appends nothing does not write the file at all, so most days
      # this is a zero-byte diff for publish_data.sh.
      - name: Archive pre-kickoff weather forecast (append-only; R94)
        run: bash scripts/stage.sh --continue-on-error daily "Archive pre-kickoff weather forecast (append-only; R94)" -- python3 scripts/archive_weather_forecast.py
        continue-on-error: true   # nothing to append is not a failure

      # R51 — NEVER-REGRESS BACKTESTS run BEFORE the build: scripts.build_predictions
      # reads data/parlay_backtest.json (prop calibration + measured correlations)
      # and build_weekly ships weekly_split_v2 only while the weekly gate holds.
      # The corpus refresher pulls nflverse weekly actuals + games (best-effort:
      # the committed fixtures stay in place when the fetch fails).
      - name: Refresh backtest corpus (nflverse weekly actuals + games)
        run: bash scripts/stage.sh --continue-on-error daily "Refresh backtest corpus (nflverse weekly actuals + games)" -- python scripts/build_backtest_weekly_corpus.py
        continue-on-error: true

      - name: Weekly split never-regress backtest (writes data/weekly_backtest.json)
        run: bash scripts/stage.sh daily "Weekly split never-regress backtest (writes data/weekly_backtest.json)" -- python scripts/backtest_weekly.py

      # R70 — line-injury cascade, MEASURE ONLY (writes data/lines_backtest.json;
      # no factor ships until a variant clears never-regress on both MAE and rank).
      - name: Line-injury cascade backtest (measure only)
        run: bash scripts/stage.sh --continue-on-error daily "Line-injury cascade backtest (measure only)" -- python scripts/backtest_lines.py
        continue-on-error: true

      - name: Parlay never-regress backtest (writes data/parlay_backtest.json)
        run: bash scripts/stage.sh daily "Parlay never-regress backtest (writes data/parlay_backtest.json)" -- python scripts/backtest_parlay.py

      - name: Fetch ESPN + build real predictions + feed health
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional; market feeds degraded if unset
        run: bash scripts/stage.sh daily "Fetch ESPN + build real predictions + feed health" -- python -m scripts.build_predictions

      # R73 — WEEK-TO-WEEK PARLAY HISTORY. Archive the week parlays.json holds
      # (created on first sight, refreshed while open, frozen once every game is
      # FINAL) and rebuild data/parlays/index.json. Idempotent per updated_utc.
      - name: Parlay archive (per-week history + index)
        run: bash scripts/stage.sh daily "Parlay archive (per-week history + index)" -- python3 scripts/build_parlay_archive.py

      # R101 — this week's ANYTIME-TD probabilities (data/atd_week.json), BEFORE the
      # leg pool that offers them. The model is scripts/backtest_atd.py (imported,
      # not copied); nothing is priced unless data/atd_backtest.json is adopted,
      # and the pool offers a leg only from a file for its own week. The nflverse
      # CSVs go to $RUNNER_TEMP, never into data/. continue-on-error: a release
      # outage leaves the pool without ATD legs (week mismatch), never red.
      - name: Anytime-TD week predictions (R101)
        run: bash scripts/stage.sh --continue-on-error daily "Anytime-TD week predictions (R101)" -- python3 scripts/build_atd_week.py --cache "$RUNNER_TEMP/atd"
        continue-on-error: true

      # R76 — the MY PARLAYS candidate leg pool. AFTER build_predictions, because
      # it copies the slate's game legs verbatim and prices its props from the
      # same weekly projections; running it earlier would pool yesterday's week.
      # It refuses to write if its calibration has not cleared its own gate, so a
      # red gate leaves the previous pool standing rather than shipping legs
      # priced by coefficients that did not pass.
      - name: MY PARLAYS leg pool (wide player universe, in-support rungs only)
        run: bash scripts/stage.sh daily "MY PARLAYS leg pool (wide player universe, in-support rungs only)" -- python3 scripts/build_leg_pool.py

      # R87 — RECORD WHAT MY PARLAYS OFFERED. MY cards are built in the browser and
      # then gone, so nothing could grade them and the learning loop never saw the
      # surface that produces the most cards. This rebuilds, from the pool just
      # written, the ten cards the view would have offered for every team seed at
      # every dial AT THE POOL'S OWN generated_utc — the moment they were offered —
      # and appends anything new. Immediately after the pool step because it reads
      # that pool and stamps its as-of; first sight locks the as-made numbers and
      # a second run on the same pool changes no bytes.
      - name: MY PARLAYS offered cards (first-sight lock)
        run: bash scripts/stage.sh daily "MY PARLAYS offered cards (first-sight lock)" -- python3 scripts/build_my_cards.py

      # R70 — the OL / DL-front LINE REPORT for the week (annotation only, changes
      # no number). Best-effort: an unreachable depth chart writes the honest
      # available:false document, never invented starters.
      - name: Build the line report (OL / DL-front starters x injury report)
        run: bash scripts/stage.sh --continue-on-error daily "Build the line report (OL / DL-front starters x injury report)" -- python scripts/build_line_report.py
        continue-on-error: true

      # R51 — keep data/player_backtest.json on the SAME substrate as the
      # player_history.json this run just refreshed. It used to be written only
      # by the weekly backtest workflow, so its band-coverage claim drifted from
      # the history for days at a time (RCA 2026-09-02: the r49_override lock
      # recomputed 0.6766 against an artifact still saying 0.6875).
      - name: Player-level walk-forward backtest (same substrate as today's history)
        run: bash scripts/stage.sh daily "Player-level walk-forward backtest (same substrate as today's history)" -- python -m scripts.backtest_player

      # R49 — Sleeper's own projections, DISPLAY-ONLY (never a model input).
      # Runs AFTER the pool is built (it crosswalks against player_projections +
      # kdst_projections). A missing display feed must not block projections, so
      # the step may fail loudly without failing the run; the builder itself
      # exits non-zero and writes nothing on any fetch/import problem.
      - name: Sleeper projections (display-only reference)
        run: bash scripts/stage.sh --continue-on-error daily "Sleeper projections (display-only reference)" -- python scripts/build_sleeper_projections.py
        continue-on-error: true

      # R49 — LEARNING LEDGER. Append today's shipped + candidate estimates for
      # every remaining week (idempotent per as-of), then score every locked
      # pre-kickoff estimate against nflverse weekly actuals. The resolver skips
      # loudly while a week has no rows (no 2026 week has resolved yet) and
      # writes an honest 0-resolved record — it never invents an MAE.
      - name: Estimate ledger append (shipped + candidate, per remaining week)
        run: bash scripts/stage.sh daily "Estimate ledger append (shipped + candidate, per remaining week)" -- python scripts/build_estimate_ledger.py

      - name: Resolve estimates against nflverse weekly actuals
        run: bash scripts/stage.sh --continue-on-error daily "Resolve estimates against nflverse weekly actuals" -- python scripts/resolve_estimates.py
        continue-on-error: true   # a stats outage degrades the record, never the run

      # R58 — PARLAY-LEG LEDGER. Append today's shipped legs (idempotent per
      # parlays.json updated_utc; as-made pricing locks on first sight, post-kickoff
      # legs are recorded unlocked), then score every locked leg against nflverse
      # weekly yards. The resolver skips loudly while a week has no rows and
      # writes an honest 0-resolved record — it never invents a log-loss.
      # scripts/backtest_parlay.py (above) reads data/parlay_leg_scores.json for
      # the live_2026 block and the weekly refit, so the refit sees yesterday's
      # resolved legs — a one-day lag by design (the gate reproduces it from
      # committed inputs).
      - name: Parlay-leg ledger append (as-made pricing, locked pre-kickoff)
        run: bash scripts/stage.sh daily "Parlay-leg ledger append (as-made pricing, locked pre-kickoff)" -- python scripts/build_parlay_ledger.py

      - name: Resolve parlay legs against nflverse weekly yards
        run: bash scripts/stage.sh --continue-on-error daily "Resolve parlay legs against nflverse weekly yards" -- python scripts/resolve_parlay_legs.py
        continue-on-error: true   # a stats outage degrades the record, never the run

      # R87 — grade the recorded MY cards. Immediately after the leg resolver
      # because it reads the same nflverse release (fetch_csv, cache shared by
      # import) and the same layered finals, so the two records are always scored
      # against identical inputs on the same day. It writes the honest 0-graded
      # document while a week has no rows; an unresolved leg is pending, never a
      # miss, so the run degrades rather than inventing a hit rate.
      - name: Resolve MY cards against nflverse weekly yards
        run: bash scripts/stage.sh --continue-on-error daily "Resolve MY cards against nflverse weekly yards" -- python scripts/resolve_my_cards.py
        continue-on-error: true   # a stats outage degrades the record, never the run

      # R81 — PARLAY REPLAY LAB (measure only). Replays candidate pricing and
      # selection rules against the weeks already played, on the legs that were
      # actually locked, and writes data/replay_lab.json. It adopts NOTHING: no
      # gate, no promotion path, and no write to any calibration or slate file.
      # Runs right after the resolver so it always sees the newest outcomes.
      - name: Replay lab (candidate parlay rules vs shipped, measure only)
        run: bash scripts/stage.sh --continue-on-error daily "Replay lab (candidate parlay rules vs shipped, measure only)" -- python3 scripts/replay_lab.py
        continue-on-error: true   # a measure-only bench never degrades the run

      # R71 — post-game review over resolved estimates + the parlay-leg ledger.
      - name: Build post-game review (data/review.json)
        run: bash scripts/stage.sh daily "Build post-game review (data/review.json)" -- python3 scripts/build_review.py

      # R71 — OPTIONAL AI narrative (P10 exception): runs only when both the
      # secret and the variable are set; otherwise one-line skip, exit 0.
      - name: AI narrative (optional, env-gated)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_NARRATIVE_MODEL: ${{ vars.REVIEW_NARRATIVE_MODEL }}
        run: bash scripts/stage.sh --continue-on-error daily "AI narrative (optional, env-gated)" -- python3 scripts/build_review_narrative.py
        continue-on-error: true

      # Validate everything we're about to commit against the JSON contracts.
      - name: Validate data contracts
        run: python scripts/validate_data.py

      # RACE-SAFE PUBLISH (F16). Other crons — gameday, and the weekly backtest
      # on this same concurrency group — may push while this run is committing.
      # The old body committed locally and then retried `git pull && git push`,
      # which cannot merge once both sides hold commits from a common base;
      # repeating it could not change that. scripts/publish_data.sh now owns the
      # publish and is race-safe by construction — see docs/PUBLISH.md. It also
      # picks up data/pipeline_stages.json, which lives under data/ like every
      # other generated artifact.
      - name: Commit data/
        run: 'bash scripts/publish_data.sh "data: daily pipeline refresh [skip actions]"'
