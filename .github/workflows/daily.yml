# Daily data pipeline: scrape -> build models -> feed-health -> commit data/.
#
# CRON THROTTLING WARNING (inherited from wc2026, do not forget):
# GitHub Actions `schedule:` triggers are best-effort and HEAVILY throttled on busy
# runners — a job nominally at 06:00 UTC can fire hours late or occasionally be skipped.
# So NOTHING real-time may depend on this cadence. This daily job is for the durable,
# slow-moving record (rosters, weekly stats, season projections). Live in-game scores
# come from the gameday windows (gameday.yml) and, ultimately, an edge endpoint — never
# from this cron's timing.
name: daily-pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily (best-effort; see throttling note above)
    # Owner-requested morning refresh: 10:00 America/Chicago. Cron is UTC-only,
    # so this is 15:00 UTC during CDT and fires at 09:00 local once CST returns
    # in November — accepted rather than papered over (GitHub cannot express
    # timezones; an hour-early refresh in winter is harmless, a silent gap is
    # not). ADDED alongside the 06:00 run, not replacing it: during draft week
    # and the season, injuries/ADP move between 06:00 and mid-morning, and the
    # pipeline is idempotent — a second run with unchanged sources commits
    # nothing.
    - cron: "0 15 * * *"  # 10:00 CDT / 09:00 CST daily (best-effort)
  workflow_dispatch: {}    # allow manual runs from the Actions tab

# Only one pipeline commit in flight at a time; cancel a stale run if a new one starts.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write          # needed to commit regenerated data/ back to main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the race-safe pull --ff-only works

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Heavy data libs live ONLY on the pipeline runner, never in the gate. The gate
      # (ci.yml) installs nothing.
      - name: Install pipeline dependencies
        run: pip install --upgrade requests

      # Step 0 — LEARNING LOOP resolve. Grade yesterday's locks BEFORE rebuilding,
      # so the day's build sees a fully resolved record (and any adopted params).
      # STATUS-gated + idempotent; clean no-op when no locked game has gone FINAL.
      - name: Resolve locks against FINAL scores
        run: python -m scripts.resolve_locks

      # Step 1 — deterministic offline outputs from committed fixtures: player
      # projections + parlays. Stdlib only, no network; safe on any runner.
      - name: Build fixture-based players + parlays
        run: python -m scripts.build_all

      # Step 2 — the REAL feed. ESPN 2026 schedule + 2025 FINAL results -> Elo priors
      # -> game predictions, plus schedule_full, real team identity, injuries, and the
      # honest feed-health status. Runs AFTER build_all so real game data overwrites the
      # fixture placeholder. Fails LOUDLY on a broken feed (no continue-on-error). Market
      # feeds (odds/kalshi) stay "degraded" until ODDS_API_KEY is set; nflverse joins
      # when its scraper is wired (proxy-blocked in some sandboxes, fine on GH runners).
      - name: Refresh injury history (qb_out + skill_out application freshness)
        run: python scripts/build_injury_history.py

      - name: Refresh weather forecast (weather_wind application freshness)
        run: python scripts/build_weather_forecast.py
        continue-on-error: true   # forecast is best-effort; absence is dormant, not fatal

      # R51 — NEVER-REGRESS BACKTESTS run BEFORE the build: scripts.build_predictions
      # reads data/parlay_backtest.json (prop calibration + measured correlations)
      # and build_weekly ships weekly_split_v2 only while the weekly gate holds.
      # The corpus refresher pulls nflverse weekly actuals + games (best-effort:
      # the committed fixtures stay in place when the fetch fails).
      - name: Refresh backtest corpus (nflverse weekly actuals + games)
        run: python scripts/build_backtest_weekly_corpus.py
        continue-on-error: true

      - name: Weekly split never-regress backtest (writes data/weekly_backtest.json)
        run: python scripts/backtest_weekly.py

      # R70 — line-injury cascade, MEASURE ONLY (writes data/lines_backtest.json;
      # no factor ships until a variant clears never-regress on both MAE and rank).
      - name: Line-injury cascade backtest (measure only)
        run: python scripts/backtest_lines.py
        continue-on-error: true

      - name: Parlay never-regress backtest (writes data/parlay_backtest.json)
        run: python scripts/backtest_parlay.py

      - name: Fetch ESPN + build real predictions + feed health
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional; market feeds degraded if unset
        run: python -m scripts.build_predictions

      # R73 — WEEK-TO-WEEK PARLAY HISTORY. Archive the week parlays.json holds
      # (created on first sight, refreshed while open, frozen once every game is
      # FINAL) and rebuild data/parlays/index.json. Idempotent per updated_utc.
      - name: Parlay archive (per-week history + index)
        run: python3 scripts/build_parlay_archive.py

      # R76 — the MY PARLAYS candidate leg pool. AFTER build_predictions, because
      # it copies the slate's game legs verbatim and prices its props from the
      # same weekly projections; running it earlier would pool yesterday's week.
      # It refuses to write if its calibration has not cleared its own gate, so a
      # red gate leaves the previous pool standing rather than shipping legs
      # priced by coefficients that did not pass.
      - name: MY PARLAYS leg pool (wide player universe, in-support rungs only)
        run: python3 scripts/build_leg_pool.py

      # R70 — the OL / DL-front LINE REPORT for the week (annotation only, changes
      # no number). Best-effort: an unreachable depth chart writes the honest
      # available:false document, never invented starters.
      - name: Build the line report (OL / DL-front starters x injury report)
        run: python scripts/build_line_report.py
        continue-on-error: true

      # R51 — keep data/player_backtest.json on the SAME substrate as the
      # player_history.json this run just refreshed. It used to be written only
      # by the weekly backtest workflow, so its band-coverage claim drifted from
      # the history for days at a time (RCA 2026-09-02: the r49_override lock
      # recomputed 0.6766 against an artifact still saying 0.6875).
      - name: Player-level walk-forward backtest (same substrate as today's history)
        run: python -m scripts.backtest_player

      # R49 — Sleeper's own projections, DISPLAY-ONLY (never a model input).
      # Runs AFTER the pool is built (it crosswalks against player_projections +
      # kdst_projections). A missing display feed must not block projections, so
      # the step may fail loudly without failing the run; the builder itself
      # exits non-zero and writes nothing on any fetch/import problem.
      - name: Sleeper projections (display-only reference)
        run: python scripts/build_sleeper_projections.py
        continue-on-error: true

      # R49 — LEARNING LEDGER. Append today's shipped + candidate estimates for
      # every remaining week (idempotent per as-of), then score every locked
      # pre-kickoff estimate against nflverse weekly actuals. The resolver skips
      # loudly while a week has no rows (no 2026 week has resolved yet) and
      # writes an honest 0-resolved record — it never invents an MAE.
      - name: Estimate ledger append (shipped + candidate, per remaining week)
        run: python scripts/build_estimate_ledger.py

      - name: Resolve estimates against nflverse weekly actuals
        run: python scripts/resolve_estimates.py
        continue-on-error: true   # a stats outage degrades the record, never the run

      # R58 — PARLAY-LEG LEDGER. Append today's shipped legs (idempotent per
      # parlays.json updated_utc; as-made pricing locks on first sight, post-kickoff
      # legs are recorded unlocked), then score every locked leg against nflverse
      # weekly yards. The resolver skips loudly while a week has no rows and
      # writes an honest 0-resolved record — it never invents a log-loss.
      # scripts/backtest_parlay.py (above) reads data/parlay_leg_scores.json for
      # the live_2026 block and the weekly refit, so the refit sees yesterday's
      # resolved legs — a one-day lag by design (the gate reproduces it from
      # committed inputs).
      - name: Parlay-leg ledger append (as-made pricing, locked pre-kickoff)
        run: python scripts/build_parlay_ledger.py

      - name: Resolve parlay legs against nflverse weekly yards
        run: python scripts/resolve_parlay_legs.py
        continue-on-error: true   # a stats outage degrades the record, never the run

      # R71 — post-game review over resolved estimates + the parlay-leg ledger.
      - name: Build post-game review (data/review.json)
        run: python3 scripts/build_review.py

      # R71 — OPTIONAL AI narrative (P10 exception): runs only when both the
      # secret and the variable are set; otherwise one-line skip, exit 0.
      - name: AI narrative (optional, env-gated)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_NARRATIVE_MODEL: ${{ vars.REVIEW_NARRATIVE_MODEL }}
        run: python3 scripts/build_review_narrative.py
        continue-on-error: true

      # Validate everything we're about to commit against the JSON contracts.
      - name: Validate data contracts
        run: python scripts/validate_data.py

      # Race-safe commit: other crons (gameday) may push concurrently. Rebase-free:
      # pull --ff-only, then commit + push; on a data conflict prefer freshly generated
      # files (this run just produced them).
      - name: Commit data/
        run: |
          git config user.name  "nfl2026-bot"
          git config user.email "bot@j5lagenticstrategy.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: daily pipeline refresh [skip actions]"
          # race-safe push loop: fast-forward onto whatever landed, retry a few times.
          for i in 1 2 3 4 5; do
            git pull --ff-only origin main && git push origin HEAD:main && exit 0
            echo "push race, retrying ($i)..."
            sleep 5
          done
          echo "::error::could not push data after retries"
          exit 1
