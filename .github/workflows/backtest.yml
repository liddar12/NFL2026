# Weekly walk-forward backtest + promotion gate: the self-learning heartbeat.
#
# Re-runs the full 45-trial parameter grid against ALL resolved real seasons
# (2021-2025 finals + any resolved 2026 locks), refreshes the nflverse EPA
# aggregates, then gives every REGISTERED candidate signal family its
# walk-forward shot — adopting at most one family per week and only through the
# NEVER-REGRESS gate. The archived entry names the families and counts them, so
# this file never has to (the old hand-written list here went stale by ten
# families before anyone noticed). Most weeks this is a no-op that
# archives its trials into data/model_tuning.json history. CRON THROTTLING
# WARNING applies (see daily.yml): weekly cadence is best-effort, which is fine
# for a job whose output changes slowly.
name: weekly-backtest

on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesdays 07:00 UTC (after Monday night resolves)
  workflow_dispatch: {}

concurrency:
  group: data-pipeline    # never race the daily/gameday commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install --upgrade requests

      # R88 (F17) — OPEN THE PER-STAGE RECORD. Every pipeline step below runs
      # under scripts/stage.sh, which appends that step's outcome (status, exit
      # code, duration) to data/pipeline_stages.json. `begin` opens a new run for
      # this workflow: it clears the previous run's rows and CARRIES each stage's
      # last success forward, so a stage that has not succeeded in days says the
      # day it last did. Several steps below are continue-on-error, so before
      # this a failed resolver left the run green with the only evidence in the
      # Actions log; the MODEL tab's PIPELINE STAGES card reads this document.
      - name: Begin per-stage record (R88)
        run: python3 scripts/stage_status.py begin --workflow backtest --run-id "${{ github.run_id }}"

      # Resolve any locks first so the backtest sees the freshest graded record.
      - name: Resolve locks against FINAL scores
        run: bash scripts/stage.sh backtest "Resolve locks against FINAL scores" -- python -m scripts.resolve_locks

      # EPA aggregates from nflverse pbp. Past seasons are cached in the
      # committed file (never refetched); only the current season streams.
      # The runner has the network access the sandbox proxy blocks.
      - name: Build EPA history (nflverse play-by-play)
        run: bash scripts/stage.sh backtest "Build EPA history (nflverse play-by-play)" -- python scripts/build_epa_history.py

      - name: Build injury history (nflverse injuries)
        run: bash scripts/stage.sh backtest "Build injury history (nflverse injuries)" -- python scripts/build_injury_history.py

      - name: Build weather history (Open-Meteo archive)
        run: bash scripts/stage.sh backtest "Build weather history (Open-Meteo archive)" -- python scripts/build_weather_history.py

      - name: Build market baseline (measurement only - never an input)
        run: bash scripts/stage.sh backtest "Build market baseline (measurement only - never an input)" -- python scripts/build_market_baseline.py

      - name: Build player usage (opportunity metrics)
        run: bash scripts/stage.sh backtest "Build player usage (opportunity metrics)" -- python scripts/build_player_usage.py

      - name: Build player usage history (skill_out gate raw material)
        run: bash scripts/stage.sh backtest "Build player usage history (skill_out gate raw material)" -- python scripts/build_player_usage_history.py

      # Same nflverse release CSVs as the builders above, so the same runner
      # network. Without these two steps their outputs could never be refreshed
      # by any pipeline: a stale file would be indistinguishable from a fresh
      # one, and build_kdst's "keep the existing file, exit 0" degradation path
      # would be a dead end instead of a handoff to this cron.
      - name: Build weekly player usage (in-season cuts, weight 0)
        run: bash scripts/stage.sh backtest "Build weekly player usage (in-season cuts, weight 0)" -- python scripts/build_player_usage_weekly.py

      # R55 ORDER MATTERS. The corpus is built FIRST so build_kdst's weekly
      # split and the gate that judges it are looking at the same weeks; the
      # gate then runs here, not only in CI, so a cron that quietly stops
      # beating the flat season average is caught by the cron itself.
      - name: Build resolved D/ST week corpus (R55 gate raw material)
        run: bash scripts/stage.sh backtest "Build resolved D/ST week corpus (R55 gate raw material)" -- python scripts/build_kdst_history.py

      - name: Build K/DST projections (separate contract from player_projections)
        run: bash scripts/stage.sh backtest "Build K/DST projections (separate contract from player_projections)" -- python scripts/build_kdst.py

      - name: R55 D/ST weekly split never-regress verdict
        run: bash scripts/stage.sh backtest "R55 D/ST weekly split never-regress verdict" -- python scripts/backtest_kdst.py

      - name: R55 gate — the split must still beat the flat season average
        run: bash scripts/stage.sh backtest "R55 gate — the split must still beat the flat season average" -- python scripts/backtest_kdst.py --gate

      # R76 — the MY PARLAYS pool calibration, fit on the wide player universe.
      # Corpus-based like the other backtests, so it belongs here rather than in
      # the daily run; build_leg_pool.py reads the coefficients it writes.
      - name: R76 leg pool calibration (wide universe refit)
        run: bash scripts/stage.sh backtest "R76 leg pool calibration (wide universe refit)" -- python scripts/backtest_leg_pool.py

      - name: R76 gate — the pool refit must stay better calibrated and informative
        run: bash scripts/stage.sh backtest "R76 gate — the pool refit must stay better calibrated and informative" -- python scripts/backtest_leg_pool.py --gate

      # Rel18 family inputs. These three feed the five new candidate families
      # (divisional, coach_quality, coach_regime, dvp_mismatch, scheme_matchup)
      # and read the same nflverse release CSVs as the builders above, so they
      # need the same runner network. Unwired they would freeze at whatever
      # snapshot happened to be committed: every family would either measure a
      # stale artifact forever or sit in its SKIPPED branch forever, and
      # build_scheme_history's re-probe of the FTN release for the live season
      # (the thing that flips application.dark to false the season FTN appears)
      # would never run again. They must stay ABOVE the promotion gate, which
      # reads their output, and their artifacts are picked up by `git add data/`
      # in the commit step below.
      - name: Build game context (divisional / coach / referee fields)
        run: bash scripts/stage.sh backtest "Build game context (divisional / coach / referee fields)" -- python scripts/build_game_context.py

      - name: Build DvP positional history (defense-vs-position)
        run: bash scripts/stage.sh backtest "Build DvP positional history (defense-vs-position)" -- python scripts/build_dvp_positional.py

      - name: Build scheme history (FTN charting; re-probes the live season)
        run: bash scripts/stage.sh backtest "Build scheme history (FTN charting; re-probes the live season)" -- python scripts/build_scheme_history.py

      - name: Walk-forward backtest (NEVER-REGRESS gated adoption)
        run: bash scripts/stage.sh backtest "Walk-forward backtest (NEVER-REGRESS gated adoption)" -- python -m scripts.backtest

      # The self-learning step: every REGISTERED candidate family gets its
      # walk-forward shot. The archived entry names the families and counts
      # them — do not re-list them here, that is how the previous comment ended
      # up ten families out of date. Most weeks this archives trials and
      # changes nothing — that is the design.
      #
      # --propose, NOT --auto-adopt (R26, owner decision 2026-08-14). R24
      # corrected the Bonferroni divisor from grid points to candidate families
      # and in doing so lowered t_crit from 12.42 to 6.41. The correction is
      # statistically right and stays; what stops is this cron applying a
      # lowered bar to the shipped model with nobody watching. So the weekly run
      # still measures, still archives history and calibration (the MODEL tab
      # depends on that — a plain dry run would freeze it), and records a
      # clearing family as `would_adopt`. Applying it is a deliberate human act:
      #     python -m scripts.promote_signals --auto-adopt
      # Do not "fix" this back to --auto-adopt without the owner saying so.
      - name: Promotion gate (measure + archive + PROPOSE; adoption is manual)
        run: bash scripts/stage.sh backtest "Promotion gate (measure + archive + PROPOSE; adoption is manual)" -- python -m scripts.promote_signals --propose

      # Player-level walk-forward. Without this step the harness is an orphan —
      # measured once, committed, then frozen while the seasons move on, which
      # is exactly the defect (REL15 #10) it was built to retire. It exits
      # non-zero when the projection path it claims to score stops matching the
      # one the app ships, so a silent divergence reds the cron.
      - name: Player-level walk-forward backtest
        run: bash scripts/stage.sh backtest "Player-level walk-forward backtest" -- python -m scripts.backtest_player

      # R92 — the availability DEPTH cascade, measure only: the game-side qb_depth
      # family (a drop when QB1 is out, another when QB2 is out, the replacement's
      # own capability) and the player-side backup-QB effect on receivers and
      # backs. Both re-measure every week as 2026 adds the team-weeks the 2022-25
      # corpus lacks (two QB1+QB2 absences and one third-string start in four
      # seasons); adoption stays with promote_signals' never-regress gate above.
      # Both need the nflverse depth-chart releases, hence continue-on-error.
      - name: QB depth cascade backtest (measure only)
        run: bash scripts/stage.sh --continue-on-error backtest "QB depth cascade backtest (measure only)" -- python3 scripts/backtest_qb_depth.py
        continue-on-error: true
      - name: Backup-QB cascade backtest (measure only)
        run: bash scripts/stage.sh --continue-on-error backtest "Backup-QB cascade backtest (measure only)" -- python3 scripts/backtest_backup_qb.py
        continue-on-error: true

      # R49 — the player-signal fit on the RESOLVED estimate ledger. Reads
      # data/estimate_scores.json; refuses (exit 0, nothing written) until at
      # least one 2026 week has resolved. --propose ARCHIVES the verdict into
      # data/model_tuning.json history. R100 (owner, 2026-09-24: "enable the self
      # learning ai based on the results of this season") adds --adopt: the
      # SHIPPED projection's signal weights move when a refit beats what ships on
      # >= 2 held-out weeks by the margin with no week worse, and revert when full
      # strength beats them. validate_data.py refuses a weight with no receipt.
      - name: Player-signal walk-forward fit (R100 auto-adopt behind never-regress vs what ships)
        run: bash scripts/stage.sh backtest "Player-signal walk-forward fit (R100 auto-adopt behind never-regress vs what ships)" -- python scripts/fit_player_signals.py --propose --adopt

      # R94 — DOES RAIN MATTER (measure only). Two steps, in this order: the
      # play-level rate corpus first, then the measurement that reads it. They
      # sit AFTER the promotion gate and BEFORE "Validate data contracts" on
      # purpose — the artifact they write is contract-checked in the same run
      # that produced it, and then picked up by `git add data/` in the publish
      # step below, rather than landing uninspected.
      #
      # This release ADOPTS NOTHING. backtest_weather.py asserts its own
      # verdict.adopted is false with no signal family registered before it
      # writes, and the promotion gate above neither reads its artifact nor
      # gains a family from it. Nothing downstream prices a number from here.
      #
      # continue-on-error on BOTH, for the same reason the R92 pair above
      # carries it: the rate corpus is pulled from the nflverse player_stats
      # release asset, a third party nobody here controls. It is proxy-blocked
      # in some sandboxes; it DID answer from the build sandbox on 2026-09-20
      # (a 2024 pull returned 18,981 rows in seconds), so this flag guards
      # against an outage rather
      # than a standing refusal — the committed fixture is a synthetic
      # placeholder, and a clone that has never run this step measures nothing
      # rather than measuring made-up numbers. A measurement bench that cannot
      # reach its substrate must degrade rather than red a cron whose real job
      # is the promotion gate. stage.sh always exits with the command's
      # own code and only annotates the stage record, so the YAML flag is what
      # actually decides the run's colour — hence both. backtest_weather.py
      # still exits 0 and still writes a valid artifact when the corpus is
      # missing: every rate term reports substrate_unavailable and the verdict
      # is not_powered, which is the honest answer rather than a silent zero.
      #
      # THE CORPUS GOES TO $RUNNER_TEMP AND NEVER INTO data/. build_wet_rates.py
      # defaults --out-dir to data/fixtures/wet_rates, which is the COMMITTED
      # SYNTHETIC placeholder: its own selftest asserts the committed document
      # equals what --fixture-from-csv rebuilds AND that available() says no, and
      # tests/smoke.sh runs that selftest. A cron that wrote the real pull there
      # would commit ~11.7 MB of derived data (twice the largest file in data/)
      # through publish_data.sh's blanket `git add data/`, permanently redding
      # the gate - and, because the publish carries [skip actions], redding it on
      # the NEXT human push rather than on the cron that caused it. So the two
      # lines below move together: --out-dir writes the pull outside the tree and
      # --cache-dir is the only thing that tells the measurement where it went.
      # Changing one without the other leaves backtest_weather.py reading its own
      # DEFAULT_CACHE_DIR and reporting substrate_unavailable forever.
      # The trade-off, stated: a temp out-dir carries nothing forward between
      # runs, so each Tuesday refetches all five seasons (~6 s).
      - name: Wet-rates corpus (nflverse player_stats; R94 substrate)
        run: bash scripts/stage.sh --continue-on-error backtest "Wet-rates corpus (nflverse player_stats; R94 substrate)" -- python3 scripts/build_wet_rates.py --out-dir "$RUNNER_TEMP/wet_rates"
        continue-on-error: true
      - name: Weather effect backtest (measure only)
        run: bash scripts/stage.sh --continue-on-error backtest "Weather effect backtest (measure only)" -- python3 scripts/backtest_weather.py --cache-dir "$RUNNER_TEMP/wet_rates"
        continue-on-error: true

      - name: Validate data contracts
        run: python scripts/validate_data.py

      # RACE-SAFE PUBLISH (F16). This job shares the `data-pipeline` concurrency
      # group with daily.yml but NOT with gameday.yml, so a gameday window can
      # push underneath it. The old fast-forward-only pull-and-push retry loop
      # could not merge two commits from a common base; scripts/publish_data.sh
      # now owns the publish and is race-safe by construction — docs/PUBLISH.md.
      - name: Commit tuning record
        run: 'bash scripts/publish_data.sh "data: weekly backtest refit [skip actions]"'
