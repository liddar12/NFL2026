# Weekly walk-forward backtest + promotion gate: the self-learning heartbeat.
#
# Re-runs the full 45-trial parameter grid against ALL resolved real seasons
# (2021-2025 finals + any resolved 2026 locks), refreshes the nflverse EPA
# aggregates, then gives every REGISTERED candidate signal family its
# walk-forward shot — adopting at most one family per week and only through the
# NEVER-REGRESS gate. The archived entry names the families and counts them, so
# this file never has to (the old hand-written list here went stale by ten
# families before anyone noticed). Most weeks this is a no-op that
# archives its trials into data/model_tuning.json history. CRON THROTTLING
# WARNING applies (see daily.yml): weekly cadence is best-effort, which is fine
# for a job whose output changes slowly.
name: weekly-backtest

on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesdays 07:00 UTC (after Monday night resolves)
  workflow_dispatch: {}

concurrency:
  group: data-pipeline    # never race the daily/gameday commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install --upgrade requests

      # Resolve any locks first so the backtest sees the freshest graded record.
      - name: Resolve locks against FINAL scores
        run: python -m scripts.resolve_locks

      # EPA aggregates from nflverse pbp. Past seasons are cached in the
      # committed file (never refetched); only the current season streams.
      # The runner has the network access the sandbox proxy blocks.
      - name: Build EPA history (nflverse play-by-play)
        run: python scripts/build_epa_history.py

      - name: Build injury history (nflverse injuries)
        run: python scripts/build_injury_history.py

      - name: Build weather history (Open-Meteo archive)
        run: python scripts/build_weather_history.py

      - name: Build market baseline (measurement only - never an input)
        run: python scripts/build_market_baseline.py

      - name: Build player usage (opportunity metrics)
        run: python scripts/build_player_usage.py

      - name: Build player usage history (skill_out gate raw material)
        run: python scripts/build_player_usage_history.py

      # Same nflverse release CSVs as the builders above, so the same runner
      # network. Without these two steps their outputs could never be refreshed
      # by any pipeline: a stale file would be indistinguishable from a fresh
      # one, and build_kdst's "keep the existing file, exit 0" degradation path
      # would be a dead end instead of a handoff to this cron.
      - name: Build weekly player usage (in-season cuts, weight 0)
        run: python scripts/build_player_usage_weekly.py

      - name: Build K/DST projections (separate contract from player_projections)
        run: python scripts/build_kdst.py

      # Rel18 family inputs. These three feed the five new candidate families
      # (divisional, coach_quality, coach_regime, dvp_mismatch, scheme_matchup)
      # and read the same nflverse release CSVs as the builders above, so they
      # need the same runner network. Unwired they would freeze at whatever
      # snapshot happened to be committed: every family would either measure a
      # stale artifact forever or sit in its SKIPPED branch forever, and
      # build_scheme_history's re-probe of the FTN release for the live season
      # (the thing that flips application.dark to false the season FTN appears)
      # would never run again. They must stay ABOVE the promotion gate, which
      # reads their output, and their artifacts are picked up by `git add data/`
      # in the commit step below.
      - name: Build game context (divisional / coach / referee fields)
        run: python scripts/build_game_context.py

      - name: Build DvP positional history (defense-vs-position)
        run: python scripts/build_dvp_positional.py

      - name: Build scheme history (FTN charting; re-probes the live season)
        run: python scripts/build_scheme_history.py

      - name: Walk-forward backtest (NEVER-REGRESS gated adoption)
        run: python -m scripts.backtest

      # The self-learning step: every REGISTERED candidate family gets its
      # walk-forward shot. The archived entry names the families and counts
      # them — do not re-list them here, that is how the previous comment ended
      # up ten families out of date. Most weeks this archives trials and
      # changes nothing — that is the design.
      #
      # --propose, NOT --auto-adopt (R26, owner decision 2026-08-14). R24
      # corrected the Bonferroni divisor from grid points to candidate families
      # and in doing so lowered t_crit from 12.42 to 6.41. The correction is
      # statistically right and stays; what stops is this cron applying a
      # lowered bar to the shipped model with nobody watching. So the weekly run
      # still measures, still archives history and calibration (the MODEL tab
      # depends on that — a plain dry run would freeze it), and records a
      # clearing family as `would_adopt`. Applying it is a deliberate human act:
      #     python -m scripts.promote_signals --auto-adopt
      # Do not "fix" this back to --auto-adopt without the owner saying so.
      - name: Promotion gate (measure + archive + PROPOSE; adoption is manual)
        run: python -m scripts.promote_signals --propose

      # Player-level walk-forward. Without this step the harness is an orphan —
      # measured once, committed, then frozen while the seasons move on, which
      # is exactly the defect (REL15 #10) it was built to retire. It exits
      # non-zero when the projection path it claims to score stops matching the
      # one the app ships, so a silent divergence reds the cron.
      - name: Player-level walk-forward backtest
        run: python -m scripts.backtest_player

      - name: Validate data contracts
        run: python scripts/validate_data.py

      - name: Commit tuning record
        run: |
          git config user.name  "nfl2026-bot"
          git config user.email "bot@j5lagenticstrategy.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No tuning changes to commit."
            exit 0
          fi
          git commit -m "data: weekly backtest refit [skip actions]"
          for i in 1 2 3 4 5; do
            git pull --ff-only origin main && git push origin HEAD:main && exit 0
            echo "push race, retrying ($i)..."
            sleep 5
          done
          echo "::error::could not push backtest data after retries"
          exit 1
