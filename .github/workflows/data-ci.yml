# Pipeline pushes use GITHUB_TOKEN and [skip actions]. A publisher therefore
# hands its final commit to this workflow in a run-attempt artifact. Manual
# dispatch uses its event SHA unless the operator supplies a full main SHA.
name: data-ci

on:
  workflow_run:
    workflows: [daily-pipeline, gameday, weekly-backtest]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA on main (blank uses the dispatch commit)"
        type: string
      simulate_red:
        description: "Report red without running the gate (proves the issue path)"
        type: boolean
        default: false

permissions: {}

env:
  DATA_CI_TITLE: "[data-ci] main is red on pipeline data"

jobs:
  resolve:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name != 'workflow_run' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main' &&
             github.event.workflow_run.head_repository.id == github.event.repository.id)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Download the publisher receipt for this run attempt
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: published-data-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/data-ci-receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Checkout main history for commit membership verification
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - id: candidate
        name: Resolve the exact commit under test
        env:
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISH_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DISPATCH_SHA: ${{ inputs.sha }}
          RECEIPT_PATH: ${{ runner.temp }}/data-ci-receipt/published-data.txt
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_run)
              if [ ! -f "$RECEIPT_PATH" ] || [ -L "$RECEIPT_PATH" ]; then
                echo "::error::publisher receipt missing or invalid"
                exit 1
              fi
              bytes=$(wc -c < "$RECEIPT_PATH")
              pattern='^([1-9][0-9]*) ([1-9][0-9]*) (noop|[0-9a-f]{40})$'
              if [ "$bytes" -gt 100 ] || ! IFS= read -r record < "$RECEIPT_PATH" ||
                 [ "$bytes" -ne "$((${#record} + 1))" ] || ! [[ "$record" =~ $pattern ]]; then
                echo "::error::malformed publisher receipt"
                exit 1
              fi
              if [ "${BASH_REMATCH[1]}" != "$PUBLISH_RUN_ID" ] ||
                 [ "${BASH_REMATCH[2]}" != "$PUBLISH_RUN_ATTEMPT" ]; then
                echo "::error::publisher receipt belongs to another run attempt"
                exit 1
              fi
              sha="${BASH_REMATCH[3]}"
              if [ "$sha" = noop ]; then
                echo "Publisher reported no new commit"
                exit 0
              fi
              ;;
            workflow_dispatch) sha="${DISPATCH_SHA:-$GITHUB_SHA}" ;;
            *) echo "::error::unsupported data-ci trigger"; exit 1 ;;
          esac
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$(git cat-file -t "$sha" 2>/dev/null)" != commit ] ||
             ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::data-ci requires a full commit SHA reachable from main"
            exit 1
          fi
          echo "data-ci candidate: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  gate:
    needs: resolve
    if: ${{ needs.resolve.outputs.sha != '' && !inputs.simulate_red }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout the resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false
      - name: Verify the commit under test
        run: |
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          echo "Fast gate testing $TEST_SHA"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run regression gate
        run: bash tests/run_gate.sh

  e2e:
    needs: resolve
    if: ${{ needs.resolve.outputs.sha != '' && !inputs.simulate_red }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout the resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_SHA }}
          persist-credentials: false
      - name: Verify the commit under test
        run: |
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          echo "Browser E2E testing $TEST_SHA"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm i
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E (web + pwa)
        run: npm run test:e2e

  report:
    needs: [resolve, gate, e2e]
    if: ${{ always() && needs.resolve.result != 'skipped' }}
    runs-on: ubuntu-latest
    concurrency:
      group: data-ci-issue
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: read
      checks: read
    steps:
      - name: Checkout the report implementation for this workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Open, update or close the data-ci issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESOLUTION: ${{ needs.resolve.result }}
          GATE: ${{ inputs.simulate_red && 'failure' || needs.gate.result }}
          E2E: ${{ inputs.simulate_red && 'failure' || needs.e2e.result }}
          SIMULATE_RED: ${{ inputs.simulate_red || false }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SOURCE: ${{ github.event.workflow_run.name || github.event_name }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/data_ci_incident.py
