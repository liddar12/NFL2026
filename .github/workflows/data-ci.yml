# data-ci — the regression gate, run against the DATA the pipeline just shipped.
#
# WHY. Every pipeline publish (scripts/publish_data.sh) commits to main with
# [skip actions], and pushes made with GITHUB_TOKEN never start workflows anyway,
# so ci.yml has never run against a data commit. Main has gone red from data
# several times (R95, R97, R98, and the R101b daily on 2026-09-24), each found only
# when the NEXT human push ran CI. This closes that blind spot without touching
# the publish: it runs when a pipeline RUN COMPLETES (workflow_run), checks out
# main as it now stands (the data commit included) and runs exactly ci.yml's two
# jobs. [skip actions] does not apply — nothing here is triggered by a push.
#
# SAYING SO. A red result opens ONE issue titled with DATA_CI_TITLE (or comments
# on the open one), naming the pipeline run and the commit; the next green run
# closes it. The gate itself is unchanged: this is a second place it runs, not a
# second gate.
#
# A dispatch with simulate_red=true reports red without running anything, to
# prove the issue path end to end (then a plain dispatch closes it).
name: data-ci

on:
  workflow_run:
    workflows: [daily-pipeline, gameday, weekly-backtest]
    types: [completed]
  workflow_dispatch:
    inputs:
      simulate_red:
        description: "Report red without running the gate (proves the issue path)"
        type: boolean
        default: false

# Only the newest main matters: a newer pipeline run supersedes an older check.
concurrency:
  group: data-ci
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  DATA_CI_TITLE: "[data-ci] main is red on pipeline data"

jobs:
  gate:
    if: ${{ !inputs.simulate_red }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - name: Checkout main as it stands now
        uses: actions/checkout@v4
        with:
          ref: main
      - id: head
        name: Record the commit under test
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Same single source of truth as ci.yml's gate job; installs nothing.
      - name: Run regression gate
        run: bash tests/run_gate.sh

  e2e:
    if: ${{ !inputs.simulate_red }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main as it stands now
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm i
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      # The browser tests are where data has reddened main before (R23, R95).
      - name: Run browser E2E (web + pwa)
        run: npm run test:e2e

  report:
    needs: [gate, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Open, update or close the data-ci issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE: ${{ inputs.simulate_red && 'failure' || needs.gate.result }}
          E2E: ${{ inputs.simulate_red && 'failure' || needs.e2e.result }}
          SHA: ${{ needs.gate.outputs.sha || github.sha }}
          SOURCE: ${{ github.event.workflow_run.name || 'manual dispatch' }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A newer pipeline run cancelled this check: it will report, not us.
          if [ "$GATE" = "cancelled" ] || [ "$E2E" = "cancelled" ]; then
            echo "data-ci superseded (gate=${GATE}, e2e=${E2E}); nothing reported"
            exit 0
          fi
          open_issue=$(gh issue list --state open --search "in:title \"$DATA_CI_TITLE\"" \
            --json number,title --jq "map(select(.title == env.DATA_CI_TITLE)) | .[0].number // empty")
          if [ "$GATE" = "success" ] && [ "$E2E" = "success" ]; then
            echo "data-ci GREEN on ${SHA} (after ${SOURCE})"
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --comment "Green again on ${SHA} after ${SOURCE}: ${RUN_URL}"
            fi
            exit 0
          fi
          body="Regression gate on main at ${SHA}, after ${SOURCE} ${SOURCE_URL}
          - fast gate (tests/run_gate.sh): ${GATE}
          - browser E2E: ${E2E}
          Run: ${RUN_URL}
          The data the pipeline just published breaks a test. Fix forward (never by
          hand-editing data/); this issue closes on the next green data-ci run."
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh issue create --title "$DATA_CI_TITLE" --body "$body"
          fi
          # Red stays red in the Actions list too.
          exit 1
