<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Installable iOS PWA first. viewport-fit=cover lets the layout extend under
       the Dynamic Island / home indicator; theme.css re-insets it with the
       safe-area env() vars so nothing is occluded in standalone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D1117" />
  <meta name="description" content="NFL2026 — Broadcast Gameday predictions, player projections, and model-EV parlays. Installable PWA." />

  <!-- Standalone PWA hints (iOS + Android). black-translucent lets our dark bg
       run under the status bar; the app title shows on the iOS home screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NFL2026" />

  <title>NFL2026</title>

  <!-- PWA manifest + iOS home-screen icon (opaque per iOS requirement). -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  <!-- Favicon (also silences the browser's /favicon.ico auto-request). -->
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />

  <!-- theme.css owns ALL styling (dark-only Broadcast Gameday design system).
       No inline styles, no CDN, no build step. The ?v= tag is stamped with the
       commit SHA at Netlify build time (write-runtime-config.mjs) so a fresh
       index.html can never pair with a stale-while-revalidate cached CSS. -->
  <link rel="stylesheet" href="/app/theme.css?v=dev" />

  <!-- R31 — the ALTERNATIVE theme (Apple HIG). Loaded on every page load, but
       INERT: every selector inside is scoped under html[data-theme="hig"], so
       until the switch below sets that attribute this file matches nothing and
       the Broadcast design ships byte-for-byte unchanged. Scoping it that way
       (rather than swapping the <link> href at runtime) is also what makes the
       switch instant — no second network round trip on the flip. Loaded AFTER
       theme.css so the cascade order matches the specificity intent. -->
  <link rel="stylesheet" href="/app/theme-hig.css?v=dev" />

  <!-- R31 — theme switch. This runs BEFORE first paint on purpose: reading the
       stored choice from a module (deferred, executes after parse) would paint
       one frame of the Broadcast theme first and then repaint, which is the
       classic flash of the wrong theme. An inline head script is the only
       thing that runs early enough, so this is the one place in the app where
       script lives outside app/.

       Storage contract: key "nfl2026.theme.v1", values "broadcast" (default)
       and "hig". ABSENT / unreadable / any other value means the default, and
       in the default case the attribute is REMOVED rather than set to a
       falsy-ish value, so the DOM of an untouched app is identical to what it
       was before this feature existed. Every localStorage access is wrapped:
       Safari private mode throws on read AND write, and a theme switch is
       never worth breaking the boot for (the app then simply does not
       remember the choice across reloads). -->
  <script>
    (function () {
      var KEY = 'nfl2026.theme.v1';
      var HIG = 'hig';

      function read() {
        try { return localStorage.getItem(KEY); } catch (_) { return null; }
      }
      function apply(on) {
        if (on) document.documentElement.setAttribute('data-theme', HIG);
        else document.documentElement.removeAttribute('data-theme');
      }

      // Before first paint.
      apply(read() === HIG);

      // The control is static markup in the topbar, so it only exists once the
      // body has parsed. Label it with the theme it is currently ON, which is
      // what makes a single chip both a status readout and a switch.
      function paint(btn, on) {
        btn.textContent = on ? 'THEME · APPLE HIG' : 'THEME · BROADCAST';
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.setAttribute(
          'aria-label',
          on
            ? 'Theme: Apple HIG. Activate to switch back to Broadcast.'
            : 'Theme: Broadcast. Activate to switch to Apple HIG.'
        );
      }
      function wire() {
        var btn = document.getElementById('theme-switch');
        if (!btn) return;
        paint(btn, read() === HIG);
        btn.addEventListener('click', function () {
          var on = document.documentElement.getAttribute('data-theme') !== HIG;
          apply(on);
          try { localStorage.setItem(KEY, on ? HIG : 'broadcast'); } catch (_) {}
          paint(btn, on);
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', wire, { once: true });
      } else {
        wire();
      }
    })();
  </script>

  <!-- R25 — TEAM is DISCOVERABLE without being EXECUTED.
       app/views/players.js used to `import { cfgFromProfile } from './team.js'`
       for one 35-line function, which dragged the 3,666-line TEAM view and its
       whole subgraph (sleeper, kdst, mocks, draft-sim, auction — 451 kB) into
       the static boot graph of EVERY route, defeating main.js's deliberate
       lazy `await import('./views/team.js')`. Cutting that edge removed ~44 ms
       of parse+compile+evaluate from every route — but it also cost a cold
       deep-link straight to #/team an extra serialized round trip, measured at
       +24 to +51 ms at a realistic 40 ms RTT (invisible on localhost, which is
       why a localhost-shaped measurement missed it).
       modulepreload settles both: the browser DOWNLOADS team.js in parallel
       from parse time, so a cold #/team no longer waits on a round trip, while
       the module is only PARSED AND EVALUATED if something actually imports it
       — so the routes that never open TEAM keep the win. -->
  <link rel="modulepreload" href="/app/views/team.js" />
</head>
<body>
  <!-- App shell. .topbar clears the Dynamic Island, .tabbar clears the home
       indicator (both inset with safe-area env() in theme.css); .view scrolls
       between them. Markup classes are the shared contract the CSS + tests use. -->
  <div class="app">
    <header class="topbar">
      <div class="wordmark">NFL<span class="wm-accent">2026</span></div>
      <!-- R31 theme switch. It wears class="wk" deliberately: that is the
           topbar's existing chip idiom, already styled by theme.css, so the
           control looks native in the DEFAULT theme without adding a single
           rule to it. The label is written by the head script (it names the
           active theme), so this is empty in source. -->
      <button class="wk" id="theme-switch" type="button" aria-pressed="false"></button>
      <div class="wk" id="week-chip">WK 1</div>
    </header>

    <!-- Pipeline health chip (honest degraded/stale reporting), painted by main.js. -->
    <div class="health" id="health" role="status" aria-live="polite"></div>

    <!-- Router paints the active view here; tabindex="-1" so focus can land on
         route change for a11y. -->
    <main class="view" id="view" aria-live="polite" tabindex="-1"></main>

    <!-- Bottom tab bar. Active tab gets .tab--active + aria-selected via main.js. -->
    <nav class="tabbar" role="tablist" aria-label="Sections">
      <a class="tab" href="#/" data-tab="slate" role="tab">Slate</a>
      <a class="tab" href="#/players" data-tab="players" role="tab">Players</a>
      <a class="tab" href="#/parlays" data-tab="parlays" role="tab">Parlays</a>
      <a class="tab" href="#/team" data-tab="team" role="tab">Team</a>
      <a class="tab" href="#/lineup" data-tab="lineup" role="tab">Lineup</a>
      <a class="tab" href="#/model" data-tab="model" role="tab">Model</a>
    </nav>
  </div>

  <!-- App entry point. ES module (deferred), no bundler. It also registers the
       pure cache-purger service worker best-effort. -->
  <script type="module" src="/app/main.js"></script>
</body>
</html>
