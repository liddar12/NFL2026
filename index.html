<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Installable iOS PWA first. viewport-fit=cover lets the layout extend under
       the Dynamic Island / home indicator; theme.css re-insets it with the
       safe-area env() vars so nothing is occluded in standalone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D1117" />
  <meta name="description" content="NFL2026 — Broadcast Gameday predictions, player projections, and model-EV parlays. Installable PWA." />

  <!-- Standalone PWA hints (iOS + Android). black-translucent lets our dark bg
       run under the status bar; the app title shows on the iOS home screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NFL2026" />

  <title>NFL2026</title>

  <!-- PWA manifest + iOS home-screen icon (opaque per iOS requirement). -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
  <!-- Favicon (also silences the browser's /favicon.ico auto-request). -->
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />

  <!-- theme.css is the BASE styling layer (the Broadcast Gameday design
       system) that theme-hig.css overrides — see R34 below. No inline styles,
       no CDN, no build step. The ?v= tag is stamped with the commit SHA at
       Netlify build time (write-runtime-config.mjs) so a fresh index.html can
       never pair with a stale-while-revalidate cached CSS. -->
  <link rel="stylesheet" href="/app/theme.css?v=dev" />

  <!-- R34 — the Apple HIG theme, loaded on every page load. HIG is engineered
       as an OVERRIDE LAYER: every selector inside is scoped under
       html[data-theme="hig"] and outranks its theme.css counterpart by one
       attribute selector, so it must load AFTER theme.css. Do not merge the
       two sheets — the base file is the contract every class name is styled
       against, and the override scoping is what the theme tests lock. -->
  <link rel="stylesheet" href="/app/theme-hig.css?v=dev" />

  <!-- R34 — Apple HIG is the ONLY theme. The R31 switcher (a topbar button
       plus a nfl2026.theme.v1 storage read) is retired by owner decision: the
       attribute is stamped unconditionally, BEFORE first paint (an inline head
       script is the only thing that runs early enough — a deferred module
       would paint one Broadcast frame first, the classic wrong-theme flash).
       No storage read, no try/catch, nothing that can fail the boot:
       setAttribute on documentElement cannot throw. theme.css remains the
       BASE LAYER that theme-hig.css overrides — see the link order above. -->
  <script>document.documentElement.setAttribute('data-theme', 'hig');</script>

  <!-- R25 — TEAM is DISCOVERABLE without being EXECUTED.
       app/views/players.js used to `import { cfgFromProfile } from './team.js'`
       for one 35-line function, which dragged the 3,666-line TEAM view and its
       whole subgraph (sleeper, kdst, mocks, draft-sim, auction — 451 kB) into
       the static boot graph of EVERY route, defeating main.js's deliberate
       lazy `await import('./views/team.js')`. Cutting that edge removed ~44 ms
       of parse+compile+evaluate from every route — but it also cost a cold
       deep-link straight to #/team an extra serialized round trip, measured at
       +24 to +51 ms at a realistic 40 ms RTT (invisible on localhost, which is
       why a localhost-shaped measurement missed it).
       modulepreload settles both: the browser DOWNLOADS team.js in parallel
       from parse time, so a cold #/team no longer waits on a round trip, while
       the module is only PARSED AND EVALUATED if something actually imports it
       — so the routes that never open TEAM keep the win. -->
  <link rel="modulepreload" href="/app/views/team.js" />
</head>
<body>
  <!-- App shell. .topbar clears the Dynamic Island, .tabbar clears the home
       indicator (both inset with safe-area env() in theme.css); .view scrolls
       between them. Markup classes are the shared contract the CSS + tests use. -->
  <div class="app">
    <header class="topbar">
      <div class="wordmark">NFL<span class="wm-accent">2026</span></div>
      <!-- R34 — the R31 #theme-switch button lived here; removed with the
           switcher (HIG is the only theme). The week chip keeps the topbar's
           `wk` chip idiom. -->
      <div class="wk" id="week-chip">WK 1</div>
    </header>

    <!-- Pipeline health chip (honest degraded/stale reporting), painted by main.js. -->
    <div class="health" id="health" role="status" aria-live="polite"></div>

    <!-- Router paints the active view here; tabindex="-1" so focus can land on
         route change for a11y (main.js focuses it, which is what announces a
         route change). R30b: this element must NOT be aria-live — as a live
         region, every partial repaint (each 140ms search debounce, every draft
         pick) queued its entire changed subtree for announcement, a firehose
         that made the draft room unusable with a screen reader. Targeted
         announcements belong in #announce below. -->
    <main class="view" id="view" tabindex="-1"></main>

    <!-- R30b — dedicated announcement outlet, the same scoped-live-region
         pattern as #health above. Views write SHORT strings here ("12 players
         match", "Bid $35") instead of ever making their paint target live.
         Not yet populated by any view — wiring is the R30c a11y pass. -->
    <div id="announce" class="visually-hidden" aria-live="polite"></div>

    <!-- Bottom navigation. Active link gets .tab--active + aria-current="page"
         via main.js. R30c — these are deliberately LINKS, not role="tab": the
         old tablist/tab roles promised a widget (arrow-key navigation, roving
         tabindex, aria-controls -> tabpanel) none of which existed, so AT
         announced "tab 1 of 6" and every promised gesture did nothing. Each
         item here changes the URL hash and loads a different route — that IS
         navigation, so <nav> + links + aria-current is the honest pattern and
         needs no keyboard machinery beyond what links already have. -->
    <nav class="tabbar" aria-label="Sections">
      <a class="tab" href="#/" data-tab="slate">Slate</a>
      <a class="tab" href="#/players" data-tab="players">Players</a>
      <a class="tab" href="#/parlays" data-tab="parlays">Parlays</a>
      <a class="tab" href="#/team" data-tab="team">Team</a>
      <a class="tab" href="#/lineup" data-tab="lineup">Lineup</a>
      <a class="tab" href="#/model" data-tab="model">Model</a>
    </nav>
  </div>

  <!-- App entry point. ES module (deferred), no bundler. It also registers the
       pure cache-purger service worker best-effort. -->
  <script type="module" src="/app/main.js"></script>
</body>
</html>
